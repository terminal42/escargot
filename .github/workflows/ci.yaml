name: CI

on:
    pull_request: ~
    push:
        branches:
            - '*'
        tags:
            - '*'
    schedule:
        - cron: 0 13 * * MON

jobs:
    ci:
        uses: 'terminal42/contao-build-tools/.github/workflows/build-tools.yml@main'

    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.1'
                      phpunit: '^10.5.60'
                    - php: '8.2'
                      phpunit: '^11.5'
                    - php: '8.3'
                      phpunit: '^12.5'
                    - php: '8.4'
                      phpunit: '^13.0'
                    - php: '8.5'
                      phpunit: '^13.0'
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v2

            - name: Install the dependencies
              run: composer require --dev "phpunit/phpunit:${{ matrix.phpunit }}" --with-all-dependencies --no-interaction

            - name: Run the unit tests
              run: vendor/bin/phpunit

    prefer-lowest-tests:
        name: Prefer lowest PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.1'
                      phpunit: '^10.5.60'
                    - php: '8.2'
                      phpunit: '^11.5'
                    - php: '8.3'
                      phpunit: '^12.5'
                    - php: '8.4'
                      phpunit: '^13.0'
                    - php: '8.5'
                      phpunit: '^13.0'
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v2

            - name: Install the dependencies
              run: |
                  composer require --dev "phpunit/phpunit:${{ matrix.phpunit }}" --no-update --no-interaction
                  composer update --prefer-lowest --prefer-stable --no-interaction

            - name: Run the unit tests
              run: vendor/bin/phpunit
